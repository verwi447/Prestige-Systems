<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081c30"/>
      <stop offset="100%" stop-color="#020a14"/>
    </linearGradient>
    <radialGradient id="mesh1" cx="0.18" cy="0.14" r="0.55">
      <stop offset="0" stop-color="#0f5a86" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f5a86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="0.86" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#0d8f5c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d8f5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh3" cx="0.5" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#123a5c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#123a5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotlight" cx="0.5" cy="0.44" r="0.5">
      <stop offset="0" stop-color="#2f7fae" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2f7fae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="armLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39e08a" stop-opacity="0"/>
      <stop offset="55%" stop-color="#39e08a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#39e08a" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39e08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39e08a" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#5b86b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <style>
      @keyframes psTwinkle {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.8; }
      }
      @keyframes psGlowPulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes psDrift {
        0% { transform: translate(0, 0); }
        50% { transform: translate(10px, -8px); }
        100% { transform: translate(0, 0); }
      }
      .ps-star { animation: psTwinkle 4.5s ease-in-out infinite; }
      .ps-glow { animation: psGlowPulse 2.6s ease-in-out infinite; }
      .ps-drift { animation: psDrift 10s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .ps-star, .ps-glow, .ps-drift { animation: none; }
      }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#mesh1)"/>
  <rect width="1920" height="1080" fill="url(#mesh2)"/>
  <rect width="1920" height="1080" fill="url(#mesh3)"/>
  <rect width="1920" height="1080" fill="url(#spotlight)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- ================= fine perspective guide lines, very subtle ================= -->
  <g stroke="#7fa8d6" stroke-opacity="0.07" stroke-width="1" fill="none">
    <path d="M -100,1080 L 700,260"/>
    <path d="M 300,1080 L 860,260"/>
    <path d="M 1620,1080 L 1220,260"/>
    <path d="M 2020,1080 L 1380,260"/>
  </g>
  <g stroke="#e7c667" stroke-opacity="0.28" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="20 24">
    <path d="M 955,1080 L 1140,280"/>
  </g>

  <!-- ================= ambient bokeh ================= -->
  <g class="ps-drift">
    <circle cx="260" cy="200" r="2.6" fill="#bfe3ff" class="ps-star" style="animation-delay:0s"/>
    <circle cx="420" cy="140" r="2" fill="#bfe3ff" class="ps-star" style="animation-delay:.7s"/>
    <circle cx="180" cy="360" r="2.2" fill="#9be7c4" class="ps-star" style="animation-delay:1.4s"/>
  </g>
  <g class="ps-drift" style="animation-delay:4s">
    <circle cx="1700" cy="500" r="2.4" fill="#bfe3ff" class="ps-star" style="animation-delay:.4s"/>
    <circle cx="1560" cy="420" r="2" fill="#9be7c4" class="ps-star" style="animation-delay:1.1s"/>
  </g>

  <!-- ================= minimal line-art ANPR camera, upper-left ================= -->
  <g transform="translate(230,150)" stroke="#7fb8e0" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="30" y1="0" x2="30" y2="190"/>
    <g transform="rotate(-10)">
      <path d="M2,10 C-18,10 -22,42 -4,46 L46,46 C58,46 58,10 34,10 Z"/>
      <rect x="2" y="18" width="38" height="20" rx="3"/>
      <line x1="10" y1="24" x2="10" y2="24" stroke-width="3"/>
      <line x1="18" y1="24" x2="18" y2="24" stroke-width="3"/>
      <line x1="26" y1="24" x2="26" y2="24" stroke-width="3"/>
      <line x1="34" y1="24" x2="34" y2="24" stroke-width="3"/>
      <line x1="10" y1="32" x2="10" y2="32" stroke-width="3"/>
      <line x1="18" y1="32" x2="18" y2="32" stroke-width="3"/>
      <line x1="26" y1="32" x2="26" y2="32" stroke-width="3"/>
      <line x1="34" y1="32" x2="34" y2="32" stroke-width="3"/>
      <path d="M-4,46 C-10,62 -4,70 8,68" stroke-width="2"/>
      <circle cx="50" cy="14" r="8" fill="url(#dotGlow)" stroke="none" class="ps-glow"/>
      <circle cx="50" cy="14" r="2.4" fill="#ff4b4b" stroke="none" class="ps-glow"/>
    </g>
  </g>

  <!-- ================= hero: refined line-art barrier gate, glowing arm ================= -->
  <g transform="translate(1220,320)">
    <ellipse cx="150" cy="470" rx="190" ry="18" fill="#000000" opacity="0.3"/>

    <!-- post, thin elegant outline with soft fill -->
    <rect x="118" y="140" width="66" height="330" rx="10" fill="#0b1622" fill-opacity="0.55" stroke="#5f88b3" stroke-opacity="0.4" stroke-width="1.4"/>
    <line x1="151" y1="150" x2="151" y2="460" stroke="#5f88b3" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="151" cy="270" r="16" fill="none" stroke="#5f88b3" stroke-opacity="0.4" stroke-width="1.4"/>
    <circle cx="151" cy="270" r="5" fill="url(#dotGlow)" class="ps-glow"/>
    <circle cx="151" cy="270" r="2.4" fill="#39e08a" class="ps-glow"/>

    <!-- diagonal linkage, thin -->
    <path d="M118 210 L58 244 L118 278" fill="none" stroke="#5f88b3" stroke-opacity="0.4" stroke-width="1.4"/>

    <!-- raised arm: slim glowing line, not a bulky solid shape -->
    <g transform="rotate(-80 151 190)">
      <rect x="-160" y="184" width="320" height="10" rx="5" fill="#0b1622" fill-opacity="0.5" stroke="#5f88b3" stroke-opacity="0.35" stroke-width="1.2"/>
      <rect x="-154" y="187.5" width="308" height="3" rx="1.5" fill="url(#armLine)" class="ps-glow"/>
      <circle cx="-154" cy="189" r="7" fill="url(#dotGlow)" class="ps-glow"/>
    </g>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
