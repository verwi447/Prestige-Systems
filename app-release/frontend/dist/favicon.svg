<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Letters sit on a 4-unit grid (one pixel at 16x16), so the strokes stay sharp at 16, 32 and 64 px. -->
  <defs>
    <linearGradient id="tile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c5590" />
      <stop offset="0.55" stop-color="#0c2d55" />
      <stop offset="1" stop-color="#061a33" />
    </linearGradient>
    <radialGradient id="sheen" cx="14" cy="4" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow" cx="20" cy="24" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fd14f" stop-opacity="0.32" />
      <stop offset="1" stop-color="#8fd14f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="12" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dce8f5" />
    </linearGradient>
    <linearGradient id="green" x1="16" y1="20" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8bd147" />
      <stop offset="1" stop-color="#6da22f" />
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#020b18" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)" />
  <rect width="64" height="64" rx="14" fill="url(#sheen)" />
  <rect width="64" height="64" rx="14" fill="url(#glow)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#9cc8f0" stroke-opacity="0.22" stroke-width="1.5" />

  <g filter="url(#lift)" fill="none" stroke="url(#ink)" stroke-width="8" stroke-miterlimit="4">
    <path d="M12 52V16H24A4 4 0 0 1 28 20V28A4 4 0 0 1 24 32H12" />
    <path d="M56 16H44A4 4 0 0 0 40 20V28A4 4 0 0 0 44 32H48A4 4 0 0 1 52 36V44A4 4 0 0 1 48 48H36" />
  </g>
  <rect x="16" y="20" width="8" height="8" fill="url(#green)" />
</svg>
